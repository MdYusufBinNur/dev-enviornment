version: '3'
volumes:
  mysqldata_app:
    driver: local
  mongodb_app:
    driver: local

services:
  nginx:
    image: nginx:latest
    platform: linux/amd64
    volumes:
      - ./../apps:/var/www/apps
      - ./nginx/:/etc/nginx/conf.d/
    ports:
      - "80:80"
    command: /bin/bash -c "exec nginx -g 'daemon off;'"
    environment:
      NGINX_MAX_BODY_SIZE: 100M

  php:
     build: ./php
     volumes:
       - ./../apps:/var/www/apps
     working_dir:
       /var/www/apps

  db:
    image: mysql:8.0
    platform: linux/amd64
    environment:
      MYSQL_USER: devuser
      MYSQL_PASSWORD: s3cret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysqldata_app:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "3306:3306"

  redis:
    image: redis:latest
    platform: linux/amd64
    ports:
      - "6379:6379"